# AFEF v0.2.0 minimum-adoption template.
# Contract: ../../schemas/v0.2/project-manifest.schema.json
# Normative location: <project-root>/.afef/project-manifest.yaml
# Placeholder actor IDs and labels are not identity or approval proof.
schema_version: "0.2.0"
project:
  id: "<PROJECT_ID>"
  name: "<PROJECT_NAME>"
repository:
  identity: "<REPOSITORY_URL_OR_HOST_OWNER_NAME>"
  default_branch: "<DEFAULT_BRANCH>"
afef:
  version: "<IMMUTABLE_AFEF_VERSION>"
  commit: "<FULL_40_CHARACTER_AFEF_COMMIT>"
constitution:
  inline:
    - "<DURABLE_PROJECT_PRINCIPLE_OR_SAFETY_BOUNDARY>"
paths:
  specifications: ".afef/specifications"
  work_records: ".afef/work-records"
default_risk_profile: lean
safety_boundaries:
  - "<PROJECT_SPECIFIC_SAFETY_BOUNDARY>"
ownership:
  project_owner:
    actor_id: "<STABLE_OPAQUE_PROJECT_OWNER_ID>"
    role: product_owner
    display_name: "<OPTIONAL_NON_NORMATIVE_LABEL>"
  specification_approver:
    actor_id: "<STABLE_OPAQUE_SPECIFICATION_APPROVER_ID>"
    role: product_owner
    display_name: "<OPTIONAL_NON_NORMATIVE_LABEL>"
  final_gate_owner:
    actor_id: "<STABLE_OPAQUE_FINAL_GATE_OWNER_ID>"
    role: design_supervisor
    display_name: "<OPTIONAL_NON_NORMATIVE_LABEL>"
